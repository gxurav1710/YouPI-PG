services:
  # Aapki Node.js Application
  - type: web
    name: youpi-pg
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true # Render khud ek random key bana dega
      - key: JWT_SECRET
        generateValue: true # Render khud ek random secret bana dega
      - key: INITIAL_ADMIN_EMAIL
        value: admin@example.com # Isko apne email se badal lein
      - key: INITIAL_ADMIN_PASSWORD
        value: Admin@12345 # Isko apne strong password se badal lein
      - key: BASE_PAYMENT_API_URL
        value: https://youpi-pg.onrender.com # Deploy ke baad URL check karein
      - key: BASE_CHECKOUT_URL
        value: https://youpi-pg.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: youpi-db
          property: connectionString

databases:
  # Aapka Postgres Database
  - name: youpi-db
    databaseName: youpi_db
    user: youpi_user
    region: oregon
    plan: free
